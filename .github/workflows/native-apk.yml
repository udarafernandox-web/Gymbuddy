name: Native Kotlin Gym Buddy APK
on:
  workflow_dispatch:
  push:
    branches: [native-android]
    paths: ['app/**', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', '.github/workflows/native-apk.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native APK
        env:
          SB_URL: ${{ secrets.GYMBUDDY_SUPABASE_URL }}
          SB_KEY: ${{ secrets.GYMBUDDY_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle :app:assembleDebug --no-daemon -PsupabaseUrl="$SB_URL" -PsupabaseKey="$SB_KEY"
      - name: Validate and fingerprint
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > native-apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GymBuddy-Native-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            native-apk-sha256.txt
          if-no-files-found: error
